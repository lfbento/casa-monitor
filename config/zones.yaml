# Zonas de monitoramento — CW700S (olho-de-peixe)
# CORREÇÃO 2026-10-31: o pipeline rastreia em 2560x1440 (provado por
# capture-test + probe); as zonas originais estavam em 1280x720 (escala 2x
# errada) — por isso acesso_casa/aproximacao_portao nunca disparavam.
# Coordenadas = originais x2 (geometria preservada).
image_size: [2560, 1440]
zones:
  ZONA_RUA:
    - [512, 0]
    - [2048, 172]
    - [2560, 720]
    - [2560, 1440]
    - [1312, 1440]
    - [1024, 850]
    - [640, 220]
  ZONA_PORTAO:
    - [0, 220]
    - [360, 380]
    - [1120, 1440]
    - [640, 1440]
    - [0, 1440]
  ZONA_INTERNA:
    - [0, 0]
    - [480, 0]
    - [400, 240]
    - [120, 320]
    - [0, 260]
  # Linha reposicionada: cruza o caminho real rua→portão no meio do trajeto
  # (estimado pela grade 2560x1440: portão ~[360,450], calçada ~[1150,720])
  LINHA_ACESSO_CASA:
    - [690, 775]
    - [820, 395]
# lado de DENTRO da casa (cruzar a linha terminando nesse lado = ENTRY)
house_side: [360, 450]
